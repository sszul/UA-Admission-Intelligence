[project]
name = "ua-admission-intelligence"
version = "1.1.0"
description = "Ukrayna üniversite aday listeleri için yerel analiz uygulaması"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "sszul"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Flask",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "instance", "uploads"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
